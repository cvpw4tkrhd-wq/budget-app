<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Hushållsbudget</title>
<meta name="theme-color" content="#b8872b">
<meta name="format-detection" content="telephone=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Budget">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,450;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap');

#budget-root {
  --bg: #f6f3ec;
  --paper: #fffdf8;
  --ink: #201e1a;
  --ink-soft: #6b6558;
  --rule: #e3ddcc;
  --rule-strong: #cfc7ae;
  --johanna: #b5495b;
  --johanna-soft: #f3dfe1;
  --patrik: #2f5d62;
  --patrik-soft: #dde8e6;
  --gold: #b8872b;
  --radius: 10px;
  --shadow: 0 1px 2px rgba(32,30,26,0.06), 0 6px 20px rgba(32,30,26,0.05);
  font-family: 'Inter', -apple-system, sans-serif;
  color: var(--ink);
  background: var(--bg);
  min-height: 100%;
  padding: 0;
  -webkit-font-smoothing: antialiased;
  transition: background .2s ease, color .2s ease;
}
#budget-root[data-theme="dark"] {
  --bg: #1a1917;
  --paper: #232220;
  --ink: #f1ece1;
  --ink-soft: #a89f8c;
  --rule: #3a362e;
  --rule-strong: #4c473b;
  --johanna: #e08a97;
  --johanna-soft: #3a262b;
  --patrik: #7ec2bd;
  --patrik-soft: #1f3634;
  --gold: #e0ac4c;
  --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 6px 20px rgba(0,0,0,0.25);
}
html, body { background: #f6f3ec; margin: 0; }
html[data-theme="dark"], body[data-theme="dark"] { background: #1a1917; }

#budget-root {
  padding-top: env(safe-area-inset-top);
  padding-bottom: env(safe-area-inset-bottom);
  padding-left: env(safe-area-inset-left);
  padding-right: env(safe-area-inset-right);
}
#budget-root, #budget-root * {
  -webkit-tap-highlight-color: transparent;
}
#budget-root button, #budget-root input {
  touch-action: manipulation;
}
#budget-root * { box-sizing: border-box; }
#budget-root .mono { font-family: 'IBM Plex Mono', monospace; font-variant-numeric: tabular-nums; }

#budget-root .wrap {
  max-width: 780px;
  margin: 0 auto;
  padding: 28px 20px 60px;
}

/* Header */
#budget-root .brand {
  display: flex;
  align-items: baseline;
  gap: 10px;
  margin-bottom: 4px;
}
#budget-root .brand-mark {
  font-family: 'Fraunces', serif;
  font-size: 26px;
  font-weight: 700;
  color: var(--gold);
  line-height: 1;
}
#budget-root h1 {
  font-family: 'Fraunces', serif;
  font-weight: 600;
  font-size: 26px;
  margin: 0;
  letter-spacing: -0.01em;
}
#budget-root .subtitle {
  color: var(--ink-soft);
  font-size: 13.5px;
  margin: 0 0 22px;
}

#budget-root .top-controls {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 10px;
  margin-bottom: 18px;
}
#budget-root .segmented {
  display: inline-flex;
  background: var(--paper);
  border: 1px solid var(--rule-strong);
  border-radius: 8px;
  padding: 3px;
  gap: 2px;
}
#budget-root .segmented button {
  border: none;
  background: transparent;
  font-family: 'Inter', sans-serif;
  font-size: 13.5px;
  font-weight: 600;
  color: var(--ink-soft);
  padding: 6px 13px;
  border-radius: 6px;
  cursor: pointer;
  transition: background .15s, color .15s;
}
#budget-root .segmented button.active {
  background: var(--ink);
  color: var(--paper);
}
#budget-root .segmented button:hover:not(.active) { color: var(--ink); }

/* Month pills */
#budget-root .month-tabs {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding-bottom: 6px;
  margin-bottom: 18px;
  scrollbar-width: thin;
}
#budget-root .month-tabs::-webkit-scrollbar { height: 5px; }
#budget-root .month-tabs::-webkit-scrollbar-thumb { background: var(--rule-strong); border-radius: 4px; }
#budget-root .month-pill {
  flex: 0 0 auto;
  border: 1px solid var(--rule-strong);
  background: var(--paper);
  color: var(--ink-soft);
  font-family: 'Inter', sans-serif;
  font-size: 13px;
  font-weight: 600;
  padding: 7px 13px;
  border-radius: 999px;
  cursor: pointer;
  transition: all .15s;
  white-space: nowrap;
}
#budget-root .month-pill.active {
  background: var(--ink);
  border-color: var(--ink);
  color: var(--paper);
}
#budget-root .month-pill:hover:not(.active) { border-color: var(--ink); color: var(--ink); }

/* Ledger card */
#budget-root .card {
  background: var(--paper);
  border: 1px solid var(--rule);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  overflow: hidden;
  margin-bottom: 18px;
}
#budget-root .ledger-head {
  display: grid;
  grid-template-columns: 1fr 108px 108px 34px;
  gap: 8px;
  padding: 12px 16px;
  border-bottom: 1px solid var(--rule);
  font-size: 11.5px;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--ink-soft);
}
#budget-root .ledger-head .col-j { color: var(--johanna); text-align: right; }
#budget-root .ledger-head .col-p { color: var(--patrik); text-align: right; }

#budget-root .ledger-row {
  display: grid;
  grid-template-columns: 1fr 108px 108px 34px;
  gap: 8px;
  align-items: center;
  padding: 9px 16px;
  border-bottom: 1px solid var(--rule);
}
#budget-root .ledger-row:last-child { border-bottom: none; }
#budget-root .ledger-row .cat-name {
  font-size: 14.5px;
  font-weight: 500;
}
#budget-root .ledger-row input.cat-input {
  border: none;
  background: transparent;
  font-family: 'Inter', sans-serif;
  font-size: 14.5px;
  font-weight: 500;
  width: 100%;
  padding: 4px 0;
  color: var(--ink);
  border-bottom: 1px dashed var(--rule-strong);
}
#budget-root .ledger-row input.cat-input:focus { outline: none; border-bottom-color: var(--gold); }
#budget-root .ledger-row input.cat-input::placeholder { color: #b7ae98; font-weight: 400; }

#budget-root .amount-input {
  width: 100%;
  border: 1px solid var(--rule);
  border-radius: 6px;
  padding: 6px 8px;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 13.5px;
  text-align: right;
  background: var(--paper);
  color: var(--ink);
  transition: border-color .15s, box-shadow .15s;
}
#budget-root .amount-input:focus {
  outline: none;
  box-shadow: 0 0 0 2px rgba(184,135,43,0.25);
}
#budget-root .amount-input.j-input { border-color: var(--johanna-soft); }
#budget-root .amount-input.j-input:focus { border-color: var(--johanna); }
#budget-root .amount-input.p-input { border-color: var(--patrik-soft); }
#budget-root .amount-input.p-input:focus { border-color: var(--patrik); }
#budget-root .amount-input.inherited {
  font-style: italic;
  color: var(--ink-soft);
  border-style: dashed;
  background: repeating-linear-gradient(135deg, transparent, transparent 6px, rgba(184,135,43,0.05) 6px, rgba(184,135,43,0.05) 12px);
}
#budget-root .amount-input.inherited:focus {
  font-style: normal;
  color: var(--ink);
}
#budget-root .export-bar {
  display: flex;
  justify-content: flex-end;
  margin-bottom: 10px;
}
#budget-root .export-btn {
  border: 1px solid var(--rule-strong);
  background: var(--paper);
  color: var(--gold);
  font-family: 'Inter', sans-serif;
  font-weight: 600;
  font-size: 13px;
  padding: 8px 14px;
  border-radius: 8px;
  cursor: pointer;
  transition: background .15s, border-color .15s;
}
#budget-root .export-btn:hover:not(:disabled) { background: #faf4e6; border-color: var(--gold); }
#budget-root .export-btn:disabled { opacity: 0.6; cursor: default; }

#budget-root .resor-card { padding: 0; }
#budget-root .resor-head {
  display: flex;
  flex-direction: column;
  gap: 2px;
  padding: 14px 16px 10px;
  border-bottom: 1px solid var(--rule);
}
#budget-root .resor-title {
  font-family: 'Fraunces', serif;
  font-weight: 600;
  font-size: 15px;
}
#budget-root .resor-sub {
  font-size: 11px;
  color: var(--ink-soft);
}
#budget-root .resor-row {
  display: flex;
  gap: 14px;
  padding: 14px 16px;
  flex-wrap: wrap;
}
#budget-root .resor-field {
  flex: 1;
  min-width: 100px;
  display: flex;
  flex-direction: column;
  gap: 5px;
}
#budget-root .resor-label {
  font-size: 11px;
  font-weight: 700;
  color: var(--ink-soft);
  text-transform: uppercase;
  letter-spacing: 0.03em;
}
#budget-root .resor-input { border-color: var(--rule-strong); }
#budget-root .resor-input:focus { border-color: var(--gold); }
#budget-root .resor-summa {
  font-size: 16px;
  font-weight: 700;
  color: var(--gold);
  padding: 7px 0;
}
#budget-root .resor-settle {
  padding: 0 16px 10px;
  font-weight: 600;
  font-size: 13.5px;
  color: var(--johanna);
}
#budget-root .resor-note {
  padding: 0 16px 14px;
  font-size: 11px;
  color: var(--ink-soft);
  line-height: 1.4;
}

#budget-root .row-del {
  border: none;
  background: transparent;
  color: #bfb6a0;
  font-size: 17px;
  cursor: pointer;
  line-height: 1;
  padding: 4px;
  border-radius: 5px;
}
#budget-root .row-del:hover { color: var(--johanna); background: var(--johanna-soft); }

#budget-root .add-row-btn {
  display: flex;
  align-items: center;
  gap: 6px;
  width: 100%;
  text-align: left;
  padding: 12px 16px;
  border: none;
  background: transparent;
  color: var(--gold);
  font-family: 'Inter', sans-serif;
  font-weight: 600;
  font-size: 13.5px;
  cursor: pointer;
}
#budget-root .add-row-btn:hover { background: #faf4e6; }

/* Totals row inside ledger card */
#budget-root .totals-row {
  display: grid;
  grid-template-columns: 1fr 108px 108px 34px;
  gap: 8px;
  padding: 12px 16px;
  background: #faf7ef;
  border-top: 1px solid var(--rule-strong);
  font-weight: 700;
  font-size: 14.5px;
}
#budget-root .totals-row .col-j { color: var(--johanna); text-align: right; }
#budget-root .totals-row .col-p { color: var(--patrik); text-align: right; }

/* Swish summary */
#budget-root .swish-card {
  background: var(--paper);
  border: 1px solid var(--rule);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 22px 20px;
  text-align: center;
}
#budget-root .swish-flow {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 14px;
  margin-bottom: 14px;
}
#budget-root .avatar {
  width: 46px;
  height: 46px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Fraunces', serif;
  font-weight: 700;
  font-size: 17px;
  color: #fff;
  flex: 0 0 auto;
  transition: transform .2s;
}
#budget-root .avatar.j { background: var(--johanna); }
#budget-root .avatar.p { background: var(--patrik); }
#budget-root .avatar.paying { transform: scale(1.08); box-shadow: 0 0 0 4px rgba(184,135,43,0.18); }

#budget-root .arrow-track {
  position: relative;
  width: 130px;
  height: 20px;
  flex: 0 0 auto;
}
#budget-root .arrow-track svg { width: 100%; height: 100%; overflow: visible; }
#budget-root .arrow-track path.line {
  stroke: var(--rule-strong);
  stroke-width: 2;
  fill: none;
}
#budget-root .arrow-track path.line.active { stroke: var(--gold); }
#budget-root .arrow-track polygon { fill: var(--rule-strong); }
#budget-root .arrow-track polygon.active { fill: var(--gold); }
#budget-root .flow-dot {
  fill: var(--gold);
  opacity: 0;
}
#budget-root .flow-dot.animate {
  opacity: 1;
  animation: flowmove 1.6s ease-in-out infinite;
}
#budget-root .arrow-track.rev .flow-dot.animate { animation-name: flowmove-rev; }
@keyframes flowmove {
  0% { transform: translateX(0); opacity: 0; }
  15% { opacity: 1; }
  85% { opacity: 1; }
  100% { transform: translateX(110px); opacity: 0; }
}
@keyframes flowmove-rev {
  0% { transform: translateX(110px); opacity: 0; }
  15% { opacity: 1; }
  85% { opacity: 1; }
  100% { transform: translateX(0); opacity: 0; }
}
@media (prefers-reduced-motion: reduce) {
  #budget-root .flow-dot.animate { animation: none; opacity: 1; }
}

#budget-root .swish-text {
  font-family: 'Fraunces', serif;
  font-size: 19px;
  font-weight: 600;
  margin: 0 0 3px;
}
#budget-root .swish-text .amt { color: var(--gold); }
#budget-root .swish-sub {
  color: var(--ink-soft);
  font-size: 12.5px;
  margin: 0;
}
#budget-root .swish-meta {
  display: flex;
  justify-content: center;
  gap: 22px;
  margin-top: 16px;
  padding-top: 14px;
  border-top: 1px solid var(--rule);
  font-size: 12px;
  color: var(--ink-soft);
}
#budget-root .swish-meta b { color: var(--ink); font-family: 'IBM Plex Mono', monospace; font-weight: 600; }

/* Year overview */
#budget-root .year-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13.5px;
}
#budget-root .year-table th {
  text-align: right;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--ink-soft);
  padding: 10px 14px;
  border-bottom: 1px solid var(--rule-strong);
}
#budget-root .year-table th:first-child, #budget-root .year-table td:first-child { text-align: left; }
#budget-root .year-table td {
  padding: 9px 14px;
  border-bottom: 1px solid var(--rule);
  text-align: right;
}
#budget-root .year-table td.month-cell { font-weight: 600; }
#budget-root .year-table td.j { color: var(--johanna); font-family: 'IBM Plex Mono', monospace; }
#budget-root .year-table td.p { color: var(--patrik); font-family: 'IBM Plex Mono', monospace; }
#budget-root .year-table td.tot { font-family: 'IBM Plex Mono', monospace; font-weight: 600; }
#budget-root .year-table td.swish-cell { font-size: 12px; color: var(--ink-soft); }
#budget-root .year-table tr:hover td { background: #faf7ef; cursor: pointer; }
#budget-root .year-table tfoot td {
  font-weight: 700;
  border-top: 2px solid var(--rule-strong);
  border-bottom: none;
  padding-top: 12px;
  font-family: 'IBM Plex Mono', monospace;
}
#budget-root .year-table tfoot td.month-cell { font-family: 'Inter', sans-serif; }

#budget-root .loading {
  text-align: center;
  color: var(--ink-soft);
  font-size: 13.5px;
  padding: 40px 0;
}
#budget-root .save-hint {
  text-align: center;
  font-size: 11.5px;
  color: #b7ae98;
  margin-top: 10px;
  min-height: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
}
#budget-root .refresh-btn {
  border: none;
  background: transparent;
  color: var(--gold);
  font-size: 11.5px;
  font-weight: 600;
  cursor: pointer;
  padding: 2px 6px;
}
#budget-root .refresh-btn:hover { text-decoration: underline; }
#budget-root .setup-banner {
  background: #fbf1de;
  border: 1px solid #e6cf9a;
  color: #6b4f16;
  border-radius: 8px;
  padding: 14px 16px;
  font-size: 13px;
  line-height: 1.5;
  margin-bottom: 18px;
}
#budget-root .setup-banner b { display: block; margin-bottom: 4px; }
#budget-root .setup-banner code {
  background: #f3e4c3;
  padding: 1px 5px;
  border-radius: 4px;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 12px;
}
#budget-root .error-banner {
  background: #fbe3e3;
  border: 1px solid #e6a9a9;
  color: #7a2020;
  border-radius: 8px;
  padding: 12px 16px;
  font-size: 13px;
  margin-bottom: 18px;
}
#budget-root .theme-toggle {
  border: 1px solid var(--rule-strong);
  background: var(--paper);
  color: var(--ink-soft);
  width: 34px;
  height: 34px;
  border-radius: 8px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  line-height: 1;
  transition: color .15s, border-color .15s;
}
#budget-root .theme-toggle:hover { color: var(--gold); border-color: var(--gold); }
#budget-root .controls-right {
  display: flex;
  align-items: center;
  gap: 8px;
}
#budget-root .app-footer {
  text-align: center;
  margin-top: 26px;
  font-size: 11px;
  color: var(--ink-soft);
  opacity: 0.7;
}
#budget-root #request-counter {
  margin-top: 4px;
  opacity: 0.55;
}

/* Row-cell wrappers (also used for responsive re-layout below) */
#budget-root .cell-name { grid-area: name; min-width: 0; }
#budget-root .cell-j { grid-area: j; min-width: 0; }
#budget-root .cell-p { grid-area: p; min-width: 0; }
#budget-root .cell-del { grid-area: del; }
#budget-root .amt-label {
  display: none;
  font-size: 10.5px;
  font-weight: 700;
  margin-bottom: 3px;
  letter-spacing: 0.02em;
}
#budget-root .amt-label.j { color: var(--johanna); }
#budget-root .amt-label.p { color: var(--patrik); }

/* ── iPhone / small-screen adjustments ──────────────────────────────── */
@media (max-width: 480px) {
  #budget-root .wrap { padding: max(18px, env(safe-area-inset-top)) 14px 40px; }
  #budget-root h1 { font-size: 22px; }
  #budget-root .top-controls { gap: 8px; }
  #budget-root .segmented button { padding: 7px 10px; font-size: 13px; }

  /* Prevent iOS auto-zoom: form fields need a >=16px font-size */
  #budget-root .amount-input,
  #budget-root .cat-input { font-size: 16px; }

  /* Bigger touch targets */
  #budget-root .amount-input { padding: 11px 10px; }
  #budget-root .month-pill { padding: 9px 14px; }
  #budget-root .row-del { font-size: 20px; padding: 8px; }
  #budget-root .theme-toggle { width: 40px; height: 40px; }

  /* Smoother horizontal swipe through months */
  #budget-root .month-tabs {
    -webkit-overflow-scrolling: touch;
    scroll-snap-type: x proximity;
  }
  #budget-root .month-pill { scroll-snap-align: start; }

  /* Header row too tight for 4 columns on narrow phones — the inline
     amt-label on each row already names the columns, so hide it */
  #budget-root .ledger-head { display: none; }

  #budget-root .totals-row,
  #budget-root .ledger-head {
    grid-template-columns: 1fr 74px 74px 26px;
  }

  /* Stack each row: name on its own line, amounts side by side below */
  #budget-root .ledger-row {
    grid-template-columns: 1fr 1fr 30px;
    grid-template-areas: "name name del" "j p del";
    row-gap: 8px;
    padding: 12px 14px;
  }
  #budget-root .cell-del { align-self: start; justify-self: end; }
  #budget-root .amt-label { display: block; }

  /* Resor-card: stack the three fields instead of squeezing side by side */
  #budget-root .resor-row { flex-direction: column; gap: 12px; }
  #budget-root .resor-field { width: 100%; }
}

@supports (-webkit-touch-callout: none) {
  /* Safari-only: avoid the rubber-band revealing a mismatched background */
  html { background: var(--bg, #f6f3ec); }
}
</style>
</head>
<body>

<div id="budget-root">
  <div class="wrap">
    <div class="brand"><span class="brand-mark">§</span><h1>Hushållsbudget</h1></div>
    <p class="subtitle">Johanna &amp; Patrik — delas 50/50, ändringar sparas automatiskt</p>

    <div id="setup-banner-slot"></div>
    <div id="error-banner-slot"></div>

    <div class="top-controls">
      <div class="segmented" id="year-switch">
        <button data-year="2026" class="active">2026</button>
        <button data-year="2027">2027</button>
      </div>
      <div class="controls-right">
        <div class="segmented" id="view-switch">
          <button data-view="month" class="active">Månad</button>
          <button data-view="year">Årsöversikt</button>
        </div>
        <button class="theme-toggle" id="theme-toggle" title="Byt tema" aria-label="Byt mellan ljust och mörkt tema">◐</button>
      </div>
    </div>

    <div id="month-view">
      <div class="month-tabs" id="month-tabs"></div>
      <div id="ledger-container"><div class="loading">Laddar…</div></div>
      <div class="swish-card" id="swish-card"></div>
      <div class="save-hint">
        <span id="save-hint-text">&nbsp;</span>
        <button class="refresh-btn" id="refresh-btn" title="Hämta senaste ändringar">↻ uppdatera</button>
      </div>
    </div>

    <div id="year-view" style="display:none;">
      <div class="export-bar">
        <button class="export-btn" id="export-btn">⭳ Exportera till Excel</button>
      </div>
      <div class="card">
        <div style="padding:16px 16px 0;" id="year-table-container"><div class="loading">Laddar…</div></div>
      </div>
    </div>

    <div class="app-footer" id="app-footer">&nbsp;</div>
    <div class="app-footer" id="request-counter">&nbsp;</div>
  </div>
</div>

<script>
(function() {
  // ── Versionshistorik ────────────────────────────────────────────────
  // v1.0.0 (2026-08-25) – Första version: månadsvis budget, extra-rader,
  //                        swish-uträkning, årsöversikt, Claude-lagring.
  // v1.1.0 (2026-08-25) – Bytt lagring till jsonbin.io för synk mellan
  //                        enheter/personer. Manuell uppdatera-knapp.
  // v1.2.0 (2026-08-25) – App-ikoner (favicon/hemskärm), mörkt/ljust tema,
  //                        versionsfot.
  // v1.3.0 (2026-08-25) – iPhone-anpassning: safe-area-padding, ingen
  //                        auto-zoom vid inmatning, staplad radlayout på
  //                        smala skärmar, "lägg till på hemskärmen"-metan.
  //                        Ny ikon: guldmynt med dollartecken.
  // v1.4.0 (2026-08-25) – Requesträknare (delad, sparas i binen) och
  //                        konfigurerbart synk-intervall för att hushålla
  //                        med jsonbin.io:s 10 000 gratis-requests.
  // v1.4.1 (2026-08-25) – Kalibrerade requesträknaren mot faktiskt antal
  //                        kvar på jsonbin.io (9905), visar nu "kvar"
  //                        istället för "använda".
  // v1.5.0 (2026-08-25) – Appen öppnas nu på senast visad månad/år (sparas
  //                        lokalt på enheten) istället för alltid Jan 2026.
  // v1.6.0 (2026-08-25) – Oförändrade fasta utgifter förifylls automatiskt
  //                        med föregående månads värde (kursiverat/streckat
  //                        fält). Klicka och skriv för att ersätta direkt –
  //                        hela värdet markeras vid fokus. Gäller bara de
  //                        åtta fasta raderna, inte oregelbundna utlägg.
  // v1.7.0 (2026-08-25) – Exportera till Excel-knapp i Årsöversikt: skapar
  //                        en .xlsx med en flik per månad plus en
  //                        sammanställningsflik, med aktuella belopp och
  //                        swish-uträkning. Laddar SheetJS från CDN vid
  //                        behov.
  // v1.7.1 (2026-08-25) – Minsta tid mellan två sparningar (15 sek), inte
  //                        bara paus efter senaste knapptryckning, så flera
  //                        ifyllda fält i rad inte ger en separat request
  //                        vardera.
  // v1.7.2 (2026-08-25) – Minsta tid mellan sparningar sänkt till 6 sek.
  // v1.8.0 (2026-08-25) – "Senast redigerad månad" sparas nu delat (i
  //                        molnet) istället för bara lokalt i telefonen,
  //                        så appen inte tappar den om webbläsaren rensar
  //                        sitt lokala lagringsutrymme eller ni byter
  //                        enhet.
  // v1.9.0 (2026-08-26) – Ny fristående rad "Resor till Borås" (Resedagar ×
  //                        Förbrukning = Summa). Fälten förifylls aldrig
  //                        från föregående månad. Med i Excel-exporten.
  // v1.10.0 (2026-08-26) – Resekostnaden räknas nu in i den totala swishen
  //                        längst ner (efter den vanliga 50/50-uträkningen)
  //                        istället för att visas som en egen separat
  //                        swish. Excel-exporten visar både budgetswish
  //                        exkl. resor och den slutgiltiga totalen inkl.
  //                        resor.
  // v1.10.1 (2026-08-26) – "Förbrukning" döpt om till "Kostnad T/R". Fixad
  //                        bugg där månadsraden alltid scrollade tillbaka
  //                        till januari — visar nu kvar vid senast valda
  //                        månad.
  // v1.10.2 (2026-08-26) – Fixad bugg där swish-pilen pekade åt fel håll
  //                        när Johanna skulle swisha Patrik (pilen
  //                        speglade betalaren istället för mottagaren).
  const APP_VERSION = '1.10.2';
  const APP_UPDATED = '2026-08-26';
  // ─────────────────────────────────────────────────────────────────────

  // ── jsonbin.io-inställningar ──────────────────────────────────────────
  // 1. Skapa gratiskonto på jsonbin.io
  // 2. Skapa en Bin med innehållet {}  →  kopiera Bin-ID
  // 3. Skapa en Access Key med behörighet Read + Update (inte Create/Delete)
  // 4. Klistra in båda värdena nedan mellan citattecknen
  const JSONBIN_BIN_ID = '6a8db19bda38895dfe0f2201';
  const JSONBIN_ACCESS_KEY = '$2a$10$Mc506vUHj1qyMv48jCBc.u4ol0Jyvjz9456aLuy9LD1TCr61.2wIy';
  // ─────────────────────────────────────────────────────────────────────

  // ── Spara requests ──────────────────────────────────────────────────
  // Höj SYNC_MIN_INTERVAL_SECONDS för att synka mer sällan (färre requests,
  // men längre innan ni ser varandras ändringar). 60 = hämtar som mest en
  // gång i minuten automatiskt. "↻ uppdatera"-knappen hämtar alltid direkt,
  // oavsett detta värde.
  const SYNC_MIN_INTERVAL_SECONDS = 60;
  // Hur länge appen väntar efter senaste knapptryckning innan den sparar.
  const SAVE_DEBOUNCE_MS = 1500;
  // Dessutom: minsta tid mellan två faktiska sparningar, även om ni fyller i
  // flera olika fält efter varandra med pauser emellan. Höj för att spara
  // fler requests, sänk om ni vill se ändringar synka snabbare.
  const SAVE_MIN_INTERVAL_MS = 6000;

  // Kalibrering av requesträknaren mot jsonbin.io:s dashboard. Räknaren
  // nedan (requestCount) räknar bara det appen själv gör härifrån och
  // framåt — den vet inte om requests som gjorts innan räknaren fanns.
  // Kolla "Requests Remaining" på jsonbin.io/dashboard och räkna ut:
  //   BASELINE_USED = 10000 − (det jsonbin.io visar som kvar just nu)
  // och uppdatera värdet nedan, så stämmer siffran i appen från och med nu.
  const REQUEST_TOTAL = 10000;
  const BASELINE_USED = 95; // 10 000 − 9905 kvar (avstämt 2026-08-25)
  // ─────────────────────────────────────────────────────────────────────

  const JSONBIN_BASE = 'https://api.jsonbin.io/v3/b/' + JSONBIN_BIN_ID;
  const isConfigured = JSONBIN_BIN_ID && JSONBIN_BIN_ID.indexOf('PASTE_') !== 0 &&
                        JSONBIN_ACCESS_KEY && JSONBIN_ACCESS_KEY.indexOf('PASTE_') !== 0;

  const MONTHS = ["Januari","Februari","Mars","April","Maj","Juni","Juli","Augusti","September","Oktober","November","December"];
  const FIXED_CATEGORIES = ["Hyra","CarPay","Elförbrukning","Elnät","Hemförsäkring","Boendeparkering","Lynk&Co 01","Trängselskatt"];

  const state = {
    year: 2026,
    month: 0, // 0-indexed
    view: 'month',
    data: null, // current month data
    saveTimer: null,
    remote: {}, // full cache of all months, keyed by storageKey
    fetching: false,
    lastFetchAt: 0,
    lastSaveAt: 0,
  };

  const root = document.getElementById('budget-root');
  const ledgerContainer = document.getElementById('ledger-container');
  const swishCard = document.getElementById('swish-card');
  const monthTabsEl = document.getElementById('month-tabs');
  const saveHint = document.getElementById('save-hint-text');
  const yearTableContainer = document.getElementById('year-table-container');
  const setupSlot = document.getElementById('setup-banner-slot');
  const errorSlot = document.getElementById('error-banner-slot');
  const refreshBtn = document.getElementById('refresh-btn');
  const requestCounterEl = document.getElementById('request-counter');
  const exportBtn = document.getElementById('export-btn');
  const EXPORT_LABEL = '⭳ Exportera till Excel';

  function fmt(n) {
    n = Number(n) || 0;
    return n.toLocaleString('sv-SE', { minimumFractionDigits: 0, maximumFractionDigits: 2 }) + ' kr';
  }

  function round2(n) {
    return Math.round((Number(n) || 0) * 100) / 100;
  }

  function storageKey(year, monthIdx) {
    return 'budget-' + year + '-' + String(monthIdx + 1).padStart(2, '0');
  }

  function defaultData() {
    return {
      fixed: FIXED_CATEGORIES.map(name => ({ name, johanna: '', patrik: '' })),
      extra: [],
      resor: { resedagar: '', forbrukning: '' },
    };
  }

  function normalize(raw) {
    if (!raw || typeof raw !== 'object') return defaultData();
    if (!raw.fixed || raw.fixed.length !== FIXED_CATEGORIES.length) {
      const d = defaultData();
      d.extra = raw.extra || [];
      d.resor = raw.resor || d.resor;
      return d;
    }
    raw.extra = raw.extra || [];
    raw.resor = raw.resor || { resedagar: '', forbrukning: '' };
    return raw;
  }

  function showError(msg) {
    errorSlot.innerHTML = '<div class="error-banner">' + msg + '</div>';
  }
  function clearError() { errorSlot.innerHTML = ''; }

  if (!isConfigured) {
    setupSlot.innerHTML =
      '<div class="setup-banner"><b>Molnsynk är inte inställd än</b>' +
      'Öppna filen och fyll i <code>JSONBIN_BIN_ID</code> och <code>JSONBIN_ACCESS_KEY</code> ' +
      'högst upp i &lt;script&gt;-taggen. Fram tills dess sparas inget mellan besök.</div>';
  }
  // Reads the shared request counter (stored inside the bin itself, so it's
  // shared across both of your devices) and reflects it in the UI.
  function noteRequest() {
    const meta = state.remote._meta || (state.remote._meta = {});
    meta.requestCount = (meta.requestCount || 0) + 1;
    updateRequestCounterUI();
  }

  function updateRequestCounterUI() {
    if (!requestCounterEl) return;
    if (!isConfigured) { requestCounterEl.textContent = ''; return; }
    const trackedSinceNow = (state.remote._meta && state.remote._meta.requestCount) || 0;
    const used = BASELINE_USED + trackedSinceNow;
    const remaining = Math.max(0, REQUEST_TOTAL - used);
    requestCounterEl.textContent = '≈ ' + remaining.toLocaleString('sv-SE') + ' av ' +
      REQUEST_TOTAL.toLocaleString('sv-SE') + ' jsonbin-requests kvar';
  }

  // Fetches the whole bin and updates state.remote. Returns true on success.
  // Throttled to SYNC_MIN_INTERVAL_SECONDS unless force=true (manual refresh,
  // or the very first load) — this is what keeps request usage down.
  async function fetchRemote(force) {
    if (!isConfigured) return false;
    const now = Date.now();
    if (!force && state.lastFetchAt && (now - state.lastFetchAt) < SYNC_MIN_INTERVAL_SECONDS * 1000) {
      return true; // recent enough — reuse what's already in memory, no request spent
    }
    state.fetching = true;
    try {
      const res = await fetch(JSONBIN_BASE + '/latest', {
        headers: { 'X-Access-Key': JSONBIN_ACCESS_KEY },
      });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const json = await res.json();
      state.remote = (json && json.record && typeof json.record === 'object') ? json.record : {};
      state.lastFetchAt = now;
      noteRequest();
      clearError();
      return true;
    } catch (e) {
      showError('Kunde inte hämta data från molnet. Kontrollera Bin-ID, Access Key och din internetanslutning.');
      return false;
    } finally {
      state.fetching = false;
    }
  }

  async function pushRemote() {
    if (!isConfigured) return false;
    try {
      noteRequest(); // folded into the same write, costs nothing extra
      const res = await fetch(JSONBIN_BASE, {
        method: 'PUT',
        headers: {
          'Content-Type': 'application/json',
          'X-Access-Key': JSONBIN_ACCESS_KEY,
        },
        body: JSON.stringify(state.remote),
      });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      clearError();
      return true;
    } catch (e) {
      showError('Kunde inte spara till molnet. Ändringen finns kvar i den här fliken tills det går att försöka igen.');
      return false;
    }
  }

  function getMonthData(year, monthIdx) {
    const key = storageKey(year, monthIdx);
    return normalize(state.remote[key]);
  }

  function scheduleSave() {
    saveHint.textContent = 'Sparar…';
    const key = storageKey(state.year, state.month);
    state.remote[key] = state.data;
    // Record which month was actually edited, shared via the bin itself
    // (so it survives per-device storage being cleared, and works the
    // same regardless of which device/browser you're on).
    state.remote._meta = state.remote._meta || {};
    state.remote._meta.lastEdited = { year: state.year, month: state.month };
    clearTimeout(state.saveTimer);

    const now = Date.now();
    const sinceLastSave = now - state.lastSaveAt;
    const minWait = Math.max(0, SAVE_MIN_INTERVAL_MS - sinceLastSave);
    const delay = Math.max(SAVE_DEBOUNCE_MS, minWait);

    state.saveTimer = setTimeout(async () => {
      const ok = await pushRemote();
      state.lastSaveAt = Date.now();
      saveHint.textContent = ok ? 'Sparat ✓' : 'Kunde inte spara';
      if (ok) setTimeout(() => { if (saveHint.textContent === 'Sparat ✓') saveHint.innerHTML = '&nbsp;'; }, 1400);
    }, delay);
  }

  refreshBtn.addEventListener('click', async () => {
    saveHint.textContent = 'Uppdaterar…';
    await fetchRemote(true);
    if (state.view === 'month') {
      state.data = getMonthData(state.year, state.month);
      renderLedger();
      renderSwish();
    } else {
      renderYearView();
    }
    saveHint.textContent = 'Uppdaterat ✓';
    setTimeout(() => { if (saveHint.textContent === 'Uppdaterat ✓') saveHint.innerHTML = '&nbsp;'; }, 1400);
  });

  // Silently refresh when the tab regains focus, unless the user is typing.
  // Still throttled by SYNC_MIN_INTERVAL_SECONDS like any other fetch.
  window.addEventListener('focus', async () => {
    if (!isConfigured) return;
    const active = document.activeElement;
    const isTyping = active && (active.closest('#ledger-container') || active.closest('#swish-card'));
    if (isTyping) return;
    await fetchRemote();
    if (state.view === 'month') {
      state.data = getMonthData(state.year, state.month);
      renderLedger();
      renderSwish();
    } else if (state.view === 'year') {
      renderYearView();
    }
  });

  // ── Tema (ljust/mörkt) ─────────────────────────────────────────────
  const themeToggleBtn = document.getElementById('theme-toggle');
  const THEME_KEY = 'budget-theme';

  function applyTheme(theme) {
    root.setAttribute('data-theme', theme);
    document.documentElement.setAttribute('data-theme', theme);
    document.body.setAttribute('data-theme', theme);
    themeToggleBtn.textContent = theme === 'dark' ? '☀' : '☾';
    themeToggleBtn.title = theme === 'dark' ? 'Byt till ljust tema' : 'Byt till mörkt tema';
  }

  function initTheme() {
    let saved = null;
    try { saved = localStorage.getItem(THEME_KEY); } catch (e) { /* ignore */ }
    if (saved === 'dark' || saved === 'light') {
      applyTheme(saved);
      return;
    }
    const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    applyTheme(prefersDark ? 'dark' : 'light');
  }

  themeToggleBtn.addEventListener('click', () => {
    const current = root.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
    const next = current === 'dark' ? 'light' : 'dark';
    applyTheme(next);
    try { localStorage.setItem(THEME_KEY, next); } catch (e) { /* ignore */ }
  });

  initTheme();

  // ── Kom ihåg senast visad månad/år (lokalt på den här enheten) ────────
  const LAST_VIEW_KEY = 'budget-last-view';

  function saveLastView() {
    try { localStorage.setItem(LAST_VIEW_KEY, JSON.stringify({ year: state.year, month: state.month })); }
    catch (e) { /* ignore */ }
  }

  function loadLastView() {
    try {
      const raw = localStorage.getItem(LAST_VIEW_KEY);
      if (!raw) return null;
      const v = JSON.parse(raw);
      if ((v.year === 2026 || v.year === 2027) && Number.isInteger(v.month) && v.month >= 0 && v.month <= 11) {
        return v;
      }
    } catch (e) { /* ignore */ }
    return null;
  }

  // ── Exportera till Excel ───────────────────────────────────────────
  // Laddar SheetJS (xlsx-biblioteket) från CDN först när man faktiskt
  // exporterar, så sidan inte drar in det i onödan för alla besökare.
  let xlsxLoadPromise = null;
  function loadXlsxLib() {
    if (window.XLSX) return Promise.resolve();
    if (xlsxLoadPromise) return xlsxLoadPromise;
    xlsxLoadPromise = new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
      s.onload = () => resolve();
      s.onerror = () => reject(new Error('kunde inte ladda Excel-biblioteket'));
      document.head.appendChild(s);
    });
    return xlsxLoadPromise;
  }

  function currencyFormatCols(ws, cols) {
    if (!ws['!ref']) return;
    const range = XLSX.utils.decode_range(ws['!ref']);
    for (let r = range.s.r; r <= range.e.r; r++) {
      cols.forEach(c => {
        const ref = XLSX.utils.encode_cell({ r, c });
        if (ws[ref] && typeof ws[ref].v === 'number') ws[ref].z = '#,##0.00 "kr"';
      });
    }
  }

  function swishLabelFor(j, p, arrowLong) {
    const diff = (j - p) / 2;
    if (diff > 0.004) return (arrowLong ? 'Patrik swishar Johanna ' : 'P → J ') + fmt(diff);
    if (diff < -0.004) return (arrowLong ? 'Johanna swishar Patrik ' : 'J → P ') + fmt(-diff);
    return arrowLong ? 'Ni är kvitt' : 'Kvitt';
  }

  function diffLabel(diff, arrowLong) {
    if (diff > 0.004) return (arrowLong ? 'Patrik swishar Johanna ' : 'P → J ') + fmt(diff);
    if (diff < -0.004) return (arrowLong ? 'Johanna swishar Patrik ' : 'J → P ') + fmt(-diff);
    return arrowLong ? 'Ni är kvitt' : 'Kvitt';
  }

  async function exportYearToExcel(year) {
    exportBtn.disabled = true;
    exportBtn.textContent = 'Förbereder…';
    try {
      await loadXlsxLib();
      await fetchRemote(true); // ensure the export reflects the latest synced data
      const wb = XLSX.utils.book_new();

      // Sammanställning
      const summaryRows = [['Månad', 'Johanna', 'Patrik', 'Totalt', 'Budgetswish (exkl. resor)', 'Resor till Borås (Summa)', 'Totalt att swisha (inkl. resor)']];
      let yj = 0, yp = 0, yResor = 0, yCombined = 0;
      for (let i = 0; i < 12; i++) {
        const t = computeTotals(year, i);
        const resorSumma = round2(resorSummaFor(year, i));
        const combined = combinedSwishDiff(year, i);
        yj += t.j; yp += t.p; yResor += resorSumma; yCombined += combined;
        summaryRows.push([MONTHS[i], round2(t.j), round2(t.p), round2(t.total), swishLabelFor(t.j, t.p, false),
          resorSumma, diffLabel(combined, false)]);
      }
      summaryRows.push(['Totalt ' + year, round2(yj), round2(yp), round2(yj + yp), swishLabelFor(yj, yp, false),
        round2(yResor), diffLabel(yCombined, false)]);
      const wsSummary = XLSX.utils.aoa_to_sheet(summaryRows);
      wsSummary['!cols'] = [{ wch: 12 }, { wch: 14 }, { wch: 14 }, { wch: 14 }, { wch: 26 }, { wch: 22 }, { wch: 28 }];
      currencyFormatCols(wsSummary, [1, 2, 3, 5]);
      XLSX.utils.book_append_sheet(wb, wsSummary, 'Sammanställning');

      // En flik per månad
      const usedNames = new Set();
      for (let i = 0; i < 12; i++) {
        const rows = [['Utgift', 'Johanna', 'Patrik']];
        FIXED_CATEGORIES.forEach(cat => {
          const j = resolveFixedValue(year, i, cat, 'johanna').value;
          const p = resolveFixedValue(year, i, cat, 'patrik').value;
          rows.push([cat, j === '' ? 0 : round2(Number(j)), p === '' ? 0 : round2(Number(p))]);
        });
        const data = getMonthData(year, i);
        data.extra.forEach(row => {
          if (!row.name && !row.johanna && !row.patrik) return; // hoppa över helt tomma rader
          rows.push([
            row.name || 'Övrigt',
            row.johanna === '' || row.johanna == null ? 0 : round2(Number(row.johanna)),
            row.patrik === '' || row.patrik == null ? 0 : round2(Number(row.patrik)),
          ]);
        });
        const t = computeTotals(year, i);
        rows.push([]);
        rows.push(['Totalt', round2(t.j), round2(t.p)]);
        rows.push([]);
        rows.push(['Budgetswish (exkl. resor)', swishLabelFor(t.j, t.p, true)]);

        const dagar = Number(data.resor.resedagar) || 0;
        const forbr = Number(data.resor.forbrukning) || 0;
        const resorSumma = round2(dagar * forbr);
        if (resorSumma > 0.004 || dagar || forbr) {
          rows.push([]);
          rows.push(['Resor till Borås', 'Resedagar', 'Kostnad T/R']);
          rows.push(['', dagar, round2(forbr)]);
          rows.push(['Summa', resorSumma]);
        }
        rows.push([]);
        rows.push(['Totalt att swisha (budget + resor)', diffLabel(combinedSwishDiff(year, i), true)]);

        const ws = XLSX.utils.aoa_to_sheet(rows);
        ws['!cols'] = [{ wch: 26 }, { wch: 14 }, { wch: 14 }];
        currencyFormatCols(ws, [1, 2]);


        let baseName = MONTHS[i].slice(0, 3) + ' ' + year;
        let sheetName = baseName;
        let n = 2;
        while (usedNames.has(sheetName)) { sheetName = baseName + ' (' + n + ')'; n++; }
        usedNames.add(sheetName);
        XLSX.utils.book_append_sheet(wb, ws, sheetName);
      }

      XLSX.writeFile(wb, 'Hushallsbudget_' + year + '.xlsx');
    } catch (e) {
      showError('Kunde inte exportera till Excel (' + e.message + '). Kontrollera din internetanslutning och försök igen.');
    } finally {
      exportBtn.disabled = false;
      exportBtn.textContent = EXPORT_LABEL;
    }
  }

  exportBtn.addEventListener('click', () => exportYearToExcel(state.year));

  // ── Versionsfot ─────────────────────────────────────────────────────
  document.getElementById('app-footer').textContent =
    'Hushållsbudget v' + APP_VERSION + ' · uppdaterad ' + APP_UPDATED;
  updateRequestCounterUI(); // show the baseline estimate immediately, before first sync

  function totals(data) {
    let j = 0, p = 0;
    [...data.fixed, ...data.extra].forEach(row => {
      j += Number(row.johanna) || 0;
      p += Number(row.patrik) || 0;
    });
    return { j, p, total: j + p };
  }

  // Walks backward from (year, monthIdx) — including the month itself —
  // looking for the nearest explicit (non-blank) value for a fixed category.
  // Only applies to the eight fixed rows; irregular "Övrigt" rows never
  // carry forward. Returns { value, inherited, fromYear, fromMonth }.
  function resolveFixedValue(year, monthIdx, catName, person) {
    let y = year, m = monthIdx;
    while (true) {
      const raw = state.remote[storageKey(y, m)];
      if (raw && Array.isArray(raw.fixed)) {
        const row = raw.fixed.find(r => r.name === catName);
        if (row) {
          const val = row[person];
          if (val !== '' && val != null) {
            return { value: val, inherited: !(y === year && m === monthIdx), fromYear: y, fromMonth: m };
          }
        }
      }
      if (y === 2026 && m === 0) break; // no earlier month exists
      m -= 1;
      if (m < 0) { m = 11; y -= 1; }
    }
    return { value: '', inherited: false, fromYear: null, fromMonth: null };
  }

  // Totals for a given month, using inherited values for any fixed-row
  // cell the user hasn't explicitly filled in this month.
  function computeTotals(year, monthIdx) {
    let j = 0, p = 0;
    FIXED_CATEGORIES.forEach(catName => {
      j += Number(resolveFixedValue(year, monthIdx, catName, 'johanna').value) || 0;
      p += Number(resolveFixedValue(year, monthIdx, catName, 'patrik').value) || 0;
    });
    const data = getMonthData(year, monthIdx);
    data.extra.forEach(row => {
      j += Number(row.johanna) || 0;
      p += Number(row.patrik) || 0;
    });
    return { j, p, total: j + p };
  }

  function resorSummaFor(year, monthIdx) {
    const data = getMonthData(year, monthIdx);
    return (Number(data.resor.resedagar) || 0) * (Number(data.resor.forbrukning) || 0);
  }

  // Final settlement for a month: the regular 50/50 budget swish, with
  // Johanna's half of the Resor-till-Borås cost added on top afterwards.
  // Positive => Patrik swishar Johanna. Negative => Johanna swishar Patrik.
  function combinedSwishDiff(year, monthIdx) {
    const t = computeTotals(year, monthIdx);
    const mainDiff = (t.j - t.p) / 2;
    const resor = resorSummaFor(year, monthIdx);
    return mainDiff - resor / 2;
  }

  function renderMonthTabs() {
    monthTabsEl.innerHTML = '';
    let activeBtn = null;
    MONTHS.forEach((m, i) => {
      const btn = document.createElement('button');
      btn.className = 'month-pill' + (i === state.month ? ' active' : '');
      btn.textContent = m.slice(0, 3);
      btn.addEventListener('click', () => switchMonth(i));
      monthTabsEl.appendChild(btn);
      if (i === state.month) activeBtn = btn;
    });
    // Rebuilding the pills resets scroll to the left — bring the selected
    // month back into view instead of always snapping back to January.
    if (activeBtn) {
      activeBtn.scrollIntoView({ block: 'nearest', inline: 'nearest' });
    }
  }

  function rowTemplate(row, idx, isExtra) {
    const div = document.createElement('div');
    div.className = 'ledger-row';

    const nameCell = document.createElement('div');
    nameCell.classList.add('cell-name');
    if (isExtra) {
      const inp = document.createElement('input');
      inp.className = 'cat-input';
      inp.placeholder = 'Beskrivning, t.ex. Besiktning';
      inp.value = row.name || '';
      inp.addEventListener('input', () => { row.name = inp.value; scheduleSave(); });
      nameCell.appendChild(inp);
    } else {
      nameCell.classList.add('cat-name');
      nameCell.textContent = row.name;
    }
    div.appendChild(nameCell);

    ['johanna', 'patrik'].forEach(person => {
      const wrap = document.createElement('div');
      wrap.className = 'cell-' + (person === 'johanna' ? 'j' : 'p');

      const label = document.createElement('span');
      label.className = 'amt-label ' + (person === 'johanna' ? 'j' : 'p');
      label.textContent = person === 'johanna' ? 'Johanna' : 'Patrik';
      wrap.appendChild(label);

      const inp = document.createElement('input');
      inp.type = 'number';
      inp.inputMode = 'decimal';
      inp.step = '0.01';
      inp.min = '0';
      inp.placeholder = '0';
      inp.className = 'amount-input ' + (person === 'johanna' ? 'j-input' : 'p-input');

      let displayValue = row[person];
      let inheritedInfo = null;
      if (!isExtra && (row[person] === '' || row[person] == null)) {
        const resolved = resolveFixedValue(state.year, state.month, row.name, person);
        if (resolved.inherited && resolved.value !== '') {
          displayValue = resolved.value;
          inheritedInfo = resolved;
        }
      }
      inp.value = displayValue === '' || displayValue == null ? '' : displayValue;
      if (inheritedInfo) {
        inp.classList.add('inherited');
        inp.title = 'Oförändrat sedan ' + MONTHS[inheritedInfo.fromMonth].slice(0, 3) + ' ' + inheritedInfo.fromYear +
          ' — klicka och skriv för att ändra';
      }

      inp.addEventListener('focus', () => inp.select());
      inp.addEventListener('input', () => {
        row[person] = inp.value;
        inp.classList.remove('inherited');
        inp.removeAttribute('title');
        renderSwish();
        renderTotalsRow();
        scheduleSave();
      });
      // If cleared back to blank, snap back to showing the inherited
      // suggestion (if any) rather than leaving a confusing empty box.
      inp.addEventListener('blur', () => {
        if (inp.value !== '') return;
        if (isExtra) return;
        const resolved = resolveFixedValue(state.year, state.month, row.name, person);
        if (resolved.inherited && resolved.value !== '') {
          inp.value = resolved.value;
          inp.classList.add('inherited');
          inp.title = 'Oförändrat sedan ' + MONTHS[resolved.fromMonth].slice(0, 3) + ' ' + resolved.fromYear +
            ' — klicka och skriv för att ändra';
        }
      });
      wrap.appendChild(inp);
      div.appendChild(wrap);
    });

    const delBtn = document.createElement('button');
    delBtn.className = 'row-del cell-del';
    delBtn.innerHTML = isExtra ? '✕' : '';
    delBtn.title = isExtra ? 'Ta bort rad' : '';
    if (isExtra) {
      delBtn.addEventListener('click', () => {
        state.data.extra.splice(idx, 1);
        renderLedger();
        renderSwish();
        scheduleSave();
      });
    } else {
      delBtn.style.visibility = 'hidden';
    }
    div.appendChild(delBtn);

    return div;
  }

  let totalsRowEl = null;

  function renderTotalsRow() {
    if (!totalsRowEl) return;
    const t = computeTotals(state.year, state.month);
    totalsRowEl.innerHTML =
      '<div>Totalt</div>' +
      '<div class="col-j mono">' + fmt(t.j) + '</div>' +
      '<div class="col-p mono">' + fmt(t.p) + '</div>' +
      '<div></div>';
  }

  function renderLedger() {
    ledgerContainer.innerHTML = '';
    const card = document.createElement('div');
    card.className = 'card';

    const head = document.createElement('div');
    head.className = 'ledger-head';
    head.innerHTML = '<div>Utgift</div><div class="col-j">Johanna</div><div class="col-p">Patrik</div><div></div>';
    card.appendChild(head);

    state.data.fixed.forEach((row) => card.appendChild(rowTemplate(row, -1, false)));
    state.data.extra.forEach((row, idx) => card.appendChild(rowTemplate(row, idx, true)));

    const addBtn = document.createElement('button');
    addBtn.className = 'add-row-btn';
    addBtn.textContent = '+ Lägg till oregelbundet utlägg';
    addBtn.addEventListener('click', () => {
      state.data.extra.push({ name: '', johanna: '', patrik: '' });
      renderLedger();
      scheduleSave();
    });
    card.appendChild(addBtn);

    totalsRowEl = document.createElement('div');
    totalsRowEl.className = 'totals-row';
    card.appendChild(totalsRowEl);

    ledgerContainer.appendChild(card);
    ledgerContainer.appendChild(renderResorCard());
    renderTotalsRow();
  }

  // "Resor till Borås" — a standalone recurring row: Resedagar × Kostnad T/R
  // = Summa. Neither field carries forward from the previous month. It does
  // NOT feed into the main 50/50 Johanna/Patrik split itself, but Johanna's
  // half IS added into the final swish total at the bottom of the page,
  // after the regular budget swish has been worked out.
  function renderResorCard() {
    const card = document.createElement('div');
    card.className = 'card resor-card';

    const head = document.createElement('div');
    head.className = 'resor-head';
    head.innerHTML = '<span class="resor-title">Resor till Borås</span>' +
      '<span class="resor-sub">Utanför 50/50-delningen — läggs till den totala swishen längst ner</span>';
    card.appendChild(head);

    const row = document.createElement('div');
    row.className = 'resor-row';

    const summaVal = document.createElement('div');
    summaVal.className = 'resor-summa mono';
    const settleLine = document.createElement('div');
    settleLine.className = 'resor-settle';
    const note = document.createElement('div');
    note.className = 'resor-note';

    function refresh() {
      const dagar = Number(state.data.resor.resedagar) || 0;
      const forbr = Number(state.data.resor.forbrukning) || 0;
      const summa = dagar * forbr;
      summaVal.textContent = fmt(summa);

      if (summa > 0.004) {
        settleLine.textContent = 'Johannas andel: ' + fmt(summa / 2) + ' — ingår i totala swishen längst ner';
        settleLine.style.display = '';
        note.textContent = 'Hushållets samlade utgift för månaden inkl. resor: ' + fmt(computeTotals(state.year, state.month).total + summa) + '.';
      } else {
        settleLine.textContent = '';
        settleLine.style.display = 'none';
        note.textContent = '';
      }
    }

    function field(labelText, key, step) {
      const wrap = document.createElement('div');
      wrap.className = 'resor-field';
      const label = document.createElement('span');
      label.className = 'resor-label';
      label.textContent = labelText;
      const inp = document.createElement('input');
      inp.type = 'number';
      inp.inputMode = 'decimal';
      inp.step = step;
      inp.min = '0';
      inp.placeholder = '0';
      inp.className = 'amount-input resor-input';
      inp.value = state.data.resor[key] === '' || state.data.resor[key] == null ? '' : state.data.resor[key];
      inp.addEventListener('focus', () => inp.select());
      inp.addEventListener('input', () => {
        state.data.resor[key] = inp.value;
        refresh();
        renderSwish();
        scheduleSave();
      });
      wrap.appendChild(label);
      wrap.appendChild(inp);
      return wrap;
    }

    row.appendChild(field('Resedagar', 'resedagar', '1'));
    row.appendChild(field('Kostnad T/R', 'forbrukning', '0.01'));

    const summaWrap = document.createElement('div');
    summaWrap.className = 'resor-field';
    const summaLabel = document.createElement('span');
    summaLabel.className = 'resor-label';
    summaLabel.textContent = 'Summa';
    summaWrap.appendChild(summaLabel);
    summaWrap.appendChild(summaVal);
    row.appendChild(summaWrap);

    card.appendChild(row);
    card.appendChild(settleLine);
    card.appendChild(note);

    refresh();
    return card;
  }

  function renderSwish() {
    const t = computeTotals(state.year, state.month);
    const resor = resorSummaFor(state.year, state.month);
    const diff = combinedSwishDiff(state.year, state.month); // positive -> Patrik owes Johanna
    const each = t.total / 2;
    let payer = null, receiver = null, amount = 0;
    if (diff > 0.004) { payer = 'p'; receiver = 'j'; amount = diff; }
    else if (diff < -0.004) { payer = 'j'; receiver = 'p'; amount = -diff; }

    // J is always on the left, P always on the right. The arrowhead must
    // point at the receiver (where the money goes), not the payer — so
    // this has to key off `receiver`, not `payer`.
    const rev = receiver === 'j';
    const trackClass = 'arrow-track' + (rev ? ' rev' : '');
    const active = payer !== null;

    let flowHtml =
      '<div class="swish-flow">' +
        '<div class="avatar j' + (payer === 'j' ? ' paying' : '') + '">J</div>' +
        '<div class="' + trackClass + '">' +
          '<svg viewBox="0 0 130 20" preserveAspectRatio="none">' +
            (rev
              ? '<path class="line' + (active ? ' active' : '') + '" d="M120 10 L14 10"/><polygon class="' + (active ? 'active' : '') + '" points="14,10 24,5 24,15"/>'
              : '<path class="line' + (active ? ' active' : '') + '" d="M10 10 L116 10"/><polygon class="' + (active ? 'active' : '') + '" points="116,10 106,5 106,15"/>'
            ) +
            '<circle class="flow-dot' + (active ? ' animate' : '') + '" cx="10" cy="10" r="3.5"/>' +
          '</svg>' +
        '</div>' +
        '<div class="avatar p' + (payer === 'p' ? ' paying' : '') + '">P</div>' +
      '</div>';

    let textHtml;
    if (!active) {
      textHtml = '<p class="swish-text">Ni är kvitt</p><p class="swish-sub">Ingen swish behöver göras denna månad.</p>';
    } else {
      const payerName = payer === 'j' ? 'Johanna' : 'Patrik';
      const receiverName = receiver === 'j' ? 'Johanna' : 'Patrik';
      const sub = resor > 0.004
        ? 'Budget delad 50/50, plus Johannas halva av resorna till Borås.'
        : 'Så att båda landar på samma andel av totalen.';
      textHtml =
        '<p class="swish-text">' + payerName + ' swishar ' + receiverName + ' <span class="amt mono">' + fmt(amount) + '</span></p>' +
        '<p class="swish-sub">' + sub + '</p>';
    }

    const metaHtml =
      '<div class="swish-meta">' +
        '<span>Totalt: <b>' + fmt(t.total) + '</b></span>' +
        '<span>Vardera: <b>' + fmt(each) + '</b></span>' +
        (resor > 0.004 ? '<span>Resor: <b>' + fmt(resor) + '</b></span>' : '') +
      '</div>';

    swishCard.innerHTML = flowHtml + textHtml + metaHtml;
  }

  async function switchMonth(idx, opts) {
    opts = opts || {};
    state.month = idx;
    renderMonthTabs();
    saveLastView();
    if (!opts.skipFetch) {
      ledgerContainer.innerHTML = '<div class="loading">Laddar…</div>';
      swishCard.innerHTML = '';
      await fetchRemote();
    }
    state.data = getMonthData(state.year, state.month);
    renderLedger();
    renderSwish();
  }

  async function switchYear(year) {
    state.year = year;
    document.querySelectorAll('#year-switch button').forEach(b => b.classList.toggle('active', b.dataset.year == year));
    saveLastView();
    if (state.view === 'month') {
      await switchMonth(state.month);
    } else {
      await renderYearView();
    }
  }

  async function renderYearView() {
    yearTableContainer.innerHTML = '<div class="loading">Laddar…</div>';
    await fetchRemote();
    const results = MONTHS.map((_, i) => i);
    let yj = 0, yp = 0;
    const rows = results.map((i) => {
      const t = computeTotals(state.year, i);
      yj += t.j; yp += t.p;
      const diff = (t.j - t.p) / 2;
      let swishLabel = 'Kvitt';
      if (diff > 0.004) swishLabel = 'P → J ' + fmt(diff);
      else if (diff < -0.004) swishLabel = 'J → P ' + fmt(-diff);
      return { name: MONTHS[i], t, swishLabel, idx: i };
    });

    let html = '<table class="year-table"><thead><tr>' +
      '<th>Månad</th><th>Johanna</th><th>Patrik</th><th>Totalt</th><th>Swish</th>' +
      '</tr></thead><tbody>';
    rows.forEach(r => {
      html += '<tr data-idx="' + r.idx + '">' +
        '<td class="month-cell">' + r.name + '</td>' +
        '<td class="j">' + fmt(r.t.j) + '</td>' +
        '<td class="p">' + fmt(r.t.p) + '</td>' +
        '<td class="tot">' + fmt(r.t.total) + '</td>' +
        '<td class="swish-cell">' + r.swishLabel + '</td>' +
        '</tr>';
    });
    const yearDiff = (yj - yp) / 2;
    let yearSwish = 'Kvitt';
    if (yearDiff > 0.004) yearSwish = 'Patrik → Johanna ' + fmt(yearDiff);
    else if (yearDiff < -0.004) yearSwish = 'Johanna → Patrik ' + fmt(-yearDiff);
    html += '</tbody><tfoot><tr>' +
      '<td class="month-cell">Totalt ' + state.year + '</td>' +
      '<td class="j">' + fmt(yj) + '</td>' +
      '<td class="p">' + fmt(yp) + '</td>' +
      '<td class="tot">' + fmt(yj + yp) + '</td>' +
      '<td class="swish-cell">' + yearSwish + '</td>' +
      '</tr></tfoot></table>';

    yearTableContainer.innerHTML = html;
    yearTableContainer.querySelectorAll('tbody tr').forEach(tr => {
      tr.addEventListener('click', () => {
        const idx = Number(tr.dataset.idx);
        document.querySelector('#view-switch button[data-view="month"]').click();
        switchMonth(idx, { skipFetch: true });
      });
    });
  }

  document.getElementById('year-switch').addEventListener('click', (e) => {
    const btn = e.target.closest('button');
    if (!btn) return;
    switchYear(Number(btn.dataset.year));
  });

  document.getElementById('view-switch').addEventListener('click', (e) => {
    const btn = e.target.closest('button');
    if (!btn) return;
    const view = btn.dataset.view;
    state.view = view;
    document.querySelectorAll('#view-switch button').forEach(b => b.classList.toggle('active', b === btn));
    document.getElementById('month-view').style.display = view === 'month' ? '' : 'none';
    document.getElementById('year-view').style.display = view === 'year' ? '' : 'none';
    if (view === 'year') renderYearView();
  });

  // init
  (async () => {
    // Local last-view is instant but per-device and can be cleared by the
    // browser. Fetch the shared bin first and prefer its "last edited"
    // month/year when available — it's authoritative and works the same
    // on any device.
    const local = loadLastView();
    if (local) {
      state.year = local.year;
      state.month = local.month;
    }
    if (isConfigured) await fetchRemote(true);
    const remoteLast = state.remote._meta && state.remote._meta.lastEdited;
    if (remoteLast && (remoteLast.year === 2026 || remoteLast.year === 2027) &&
        Number.isInteger(remoteLast.month) && remoteLast.month >= 0 && remoteLast.month <= 11) {
      state.year = remoteLast.year;
      state.month = remoteLast.month;
    }
    document.querySelectorAll('#year-switch button').forEach(b => b.classList.toggle('active', Number(b.dataset.year) === state.year));
    renderMonthTabs();
    await switchMonth(state.month, { skipFetch: true }); // already fetched above
  })();
})();
</script>
</body>
</html>
